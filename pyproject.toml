[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymetropsis"
version = "v0.0.1"
authors = [{name = "Hannah Sophie Heinrichs", email = "hannahsophie.heinrichs@gmail.com"}]
channels = ["conda-forge"]
description = "Processing metropsis data with python code. Statistical analysis in R can be found elsewhere."
platforms = ["macOS", "linux"]
license = "MIT"
readme = "README.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pymetropsis"]

[tool.hatch.build]
include = [
  "src/pymetropsis/data/raw/**/*"
]

[dependencies]
python = "3.10.*"